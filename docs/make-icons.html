<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アイコン生成(開発用・アプリからはリンクしない)</title>
<style>
  body { font-family: sans-serif; padding: 2rem; background: #f5f7f3; }
  canvas { border: 1px solid #ccc; margin: 0.5rem 0; }
  button { display: block; margin: 0.5rem 0; padding: 0.5rem 1rem; }
</style>
</head>
<body>
<h1>icon.svg → PNG 生成</h1>
<p>このページは開発用です。icon.svg を canvas に描画し、512×512 の icon-512.png と
180×180 の apple-touch-icon.png をダウンロードします。アプリ本体からはリンクしません。</p>

<canvas id="c512" width="512" height="512"></canvas><br>
<button id="dl512">icon-512.png をダウンロード</button>

<canvas id="c180" width="180" height="180"></canvas><br>
<button id="dl180">apple-touch-icon.png をダウンロード</button>

<script>
async function drawAt(canvasId, size) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const res = await fetch("../icons/icon.svg");
  const svgText = await res.text();
  const img = new Image();
  const blob = new Blob([svgText], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = url;
  });
  ctx.clearRect(0, 0, size, size);
  ctx.drawImage(img, 0, 0, size, size);
  URL.revokeObjectURL(url);
}

function download(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  const a = document.createElement("a");
  a.download = filename;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

drawAt("c512", 512);
drawAt("c180", 180);

document.getElementById("dl512").addEventListener("click", () => download("c512", "icon-512.png"));
document.getElementById("dl180").addEventListener("click", () => download("c180", "apple-touch-icon.png"));
</script>
</body>
</html>
